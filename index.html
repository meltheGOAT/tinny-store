    <!-- Schema.org JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "TINNY",

        "logo": "https://tinny.ng/tinnylogo.PNG",
        "image": "https://tinny.ng/tinnylogo.PNG",
        "priceRange": "₦₦₦",

        "paymentAccepted": "Bank Transfer, WhatsApp Direct Checkout, Card",

          "@type": "PostalAddress",

          "addressRegion": "FCT",
          "addressCountry": "NG"
        }
      }

    <!-- Loading screen styles (inline for instant render) -->
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      .loading-logo {
        width: 90px;
        height: 90px;
        object-fit: contain;
        animation: logo-pulse 1.8s ease-in-out infinite;
        filter: brightness(0) invert(1);
      }
      @keyframes logo-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
      #loading-screen.loading-fade-out {
        animation: loading-exit 0.6s ease-out forwards;
      }
      @keyframes loading-exit {
        0% { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
      }
    </style>
    <!-- Google Fonts (DM Sans, Karla, JetBrains Mono, Cormorant Garamond, Playfair Display, Pinyon Script, Alex Brush) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
