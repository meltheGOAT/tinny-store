services:
  - type: web
    name: tinny-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false   # Paste your Neon PostgreSQL connection string in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set a strong secret in Render dashboard
      - key: CLIENT_URL
        sync: false   # Set to your Vercel frontend URL e.g. https://tinny.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
